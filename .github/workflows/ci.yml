name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} / Postgres ${{ matrix.postgres }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { elixir: "1.15", otp: "26", postgres: "14" }
          - { elixir: "1.17", otp: "27", postgres: "16" }
          - { elixir: "1.19", otp: "28", postgres: "17" }

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test --cover

  # The same behaviour on MySQL 8: the dialect, the batched writes, the outbox (test/mysql).
  mysql:
    runs-on: ubuntu-latest
    name: MySQL ${{ matrix.mysql }}
    env:
      DB: mysql

    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql" --health-interval 5s
          --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build_mysql
          key: mysql-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix test --only mysql

  # Static checks, on one version: they don't depend on the database.
  static:
    runs-on: ubuntu-latest
    name: Credo and Dialyzer
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: static-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix credo --strict
      - run: mix dialyzer
